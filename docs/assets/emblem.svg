<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">VaanarSena: Hanuman leaping with the Dronagiri mountain</title>
  <defs>
    <radialGradient id="vs-glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#C9F7DA"/>
      <stop offset="0.5" stop-color="#5FD394" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2FA36B" stop-opacity="0"/>
    </radialGradient>
    <path id="vs-herb" d="M0 -5 C 0.8 -1.2, 1.2 -0.8, 5 0 C 1.2 0.8, 0.8 1.2, 0 5 C -0.8 1.2, -1.2 0.8, -5 0 C -1.2 -0.8, -0.8 -1.2, 0 -5 Z"/>
  </defs>

  <!-- the leap: an arc from the shore toward the mountain -->
  <path d="M8 192 C 30 160, 50 140, 78 126" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 9" opacity="0.9"/>

  <!-- Dronagiri, raised on the palm -->
  <circle cx="153" cy="38" r="38" fill="url(#vs-glow)"/>
  <path d="M114 63 L129 37 L137 45 L152 13 L167 37 L173 31 L188 63 Z" fill="#1F6B4A"/>
  <path d="M152 13 L160 26 L153 23 L145 28 Z" fill="#EAF7EF"/>
  <path d="M117 63 C 132 55, 149 59, 160 53 C 169 49, 179 55, 186 63 Z" fill="#164E35"/>
  <g fill="#D7FBE5">
    <use href="#vs-herb" transform="translate(140 49) scale(0.9)"/>
    <use href="#vs-herb" transform="translate(157 40) scale(1.1)"/>
    <use href="#vs-herb" transform="translate(168 52) scale(0.75)"/>
    <use href="#vs-herb" transform="translate(150 57) scale(0.55)"/>
  </g>

  <!-- Hanuman -->
  <g stroke="#E0561C" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- tail, streaming behind and curling up -->
    <path d="M83 122 C 58 128, 34 116, 34 94 C 34 81, 47 77, 53 86" stroke-width="6.5"/>
    <!-- back leg, stretched long behind: the leap -->
    <path d="M82 123 L 58 139 L 30 147" stroke-width="12.5"/>
    <!-- front leg, drawn up -->
    <path d="M90 121 L 115 127 L 111 149" stroke-width="12.5"/>
    <!-- torso -->
    <path d="M113 90 L 86 120" stroke-width="22"/>
    <!-- raised arm, palm under the mountain -->
    <path d="M117 93 L 134 81 L 147 67" stroke-width="10.5"/>
    <!-- arm with the gada -->
    <path d="M106 97 L 89 107 L 75 99" stroke-width="10"/>
  </g>
  <ellipse cx="149" cy="65" rx="10" ry="4.6" fill="#E0561C"/>

  <!-- gada -->
  <path d="M75 99 L 57 77" stroke="#C9A227" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="52" cy="70.5" r="10" fill="#C9A227"/>
  <circle cx="52" cy="70.5" r="4.2" fill="#EBCB6E"/>
  <path d="M52 60.5 L 52 55.5" stroke="#C9A227" stroke-width="3.2" stroke-linecap="round"/>

  <!-- head: crown (mukut), face, muzzle -->
  <path d="M107 71 C 107 60, 111 54, 118 49 C 125 54, 129 60, 129 71 Z" fill="#C9A227"/>
  <circle cx="118" cy="47.5" r="2.8" fill="#C9A227"/>
  <path d="M109 66 L 127 66" stroke="#EBCB6E" stroke-width="2" stroke-linecap="round"/>
  <circle cx="118" cy="79" r="11.5" fill="#E0561C"/>
  <ellipse cx="127" cy="84" rx="7" ry="5.5" fill="#E0561C"/>
  <ellipse cx="128.5" cy="83.5" rx="4.6" ry="3.4" fill="#F0915F"/>
</svg>
